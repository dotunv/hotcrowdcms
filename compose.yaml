services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DEBUG: "true"
      PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "8000:8000"
    volumes:
      - media_data:/data/media
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  media_data:
